name: Convert and Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'posts/**/*.md'
      - '*.md'
      - '_quarto.yml'
      - 'styles.css'
  pull_request:
    branches: [ main ]
    paths:
      - 'posts/**/*.md'
      - '*.md'
      - '_quarto.yml'
      - 'styles.css'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  convert-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.7.34'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-frontmatter pyyaml

      - name: Move root .md files to posts directory
        run: |
          python .github/scripts/move_md_to_posts.py

      - name: Convert .md to .qmd
        run: |
          python .github/scripts/convert_md_to_qmd.py

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add posts/**/*.qmd || true
          git add posts/**/*.md || true
          git diff --staged --quiet || git commit -m "Auto-organize and convert .md files"

      - name: Push converted files
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Render Quarto Site
        run: |
          quarto render

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: convert-and-deploy
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2