name: Publish site

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R (for R code chunks)
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages (if needed)
        run: |
          Rscript -e 'if (!requireNamespace("knitr", quietly = TRUE)) install.packages("knitr")'
          Rscript -e 'if (!requireNamespace("rmarkdown", quietly = TRUE)) install.packages("rmarkdown")'

      - name: Install Python dependencies (for scripts)
        run: |
          python -m pip install --upgrade pip
          pip install python-frontmatter pyyaml

      - name: Move root .md files to posts directory
        run: |
          python .github/scripts/move_md_to_posts.py

      - name: Convert .md to .qmd
        run: |
          python .github/scripts/convert_md_to_qmd.py

      - name: Commit conversions (no CI)
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[skip ci] chore: organize & convert posts"
          file_pattern: |
            posts/**/*.qmd
            posts/**/*.md
            *.md

      - name: Ensure date in front matter (.md/.qmd)
        run: bash .github/scripts/add_date_frontmatter.sh

      - name: Commit auto date (no CI)
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[skip ci] chore: add date to front matter"
          file_pattern: |
            **/*.md
            **/*.qmd
          skip_dirty_check: false

      - name: Render site
        run: quarto render

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5